name: iOS mobile simulator
on:
  push:
    branches: [codex/mobile-ios-20261125]
    paths: [tools/ios-ci/**, assets/**, config/buildConfig_ios.json, .github/workflows/ios-mobile-simulator.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [small-se, island-16, large-16-pro-max]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            assets
            settings
            native/engine/common
            config
            tools/ios-ci
            tools/ios-cloud-build.cjs
      - uses: actions/cache/restore@v4
        id: simulator-cache
        with:
          path: build/ios/proj/Release-iphonesimulator/DicePet-mobile.app
          key: dicekin-simulator-26.3-${{ hashFiles('assets/**', 'settings/**', 'native/engine/common/**', 'config/buildConfig_ios.json', 'tools/ios-ci/PMMobileSimulatorQA.ts', 'tools/ios-cloud-build.cjs') }}
      - uses: actions/setup-node@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: creator-cache
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          path: ~/cocos-installer
          key: cocos-creator-3.8.7-mac-080718
      - name: Install Creator 3.8.7
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/cocos-installer" "$RUNNER_TEMP/cocos"
          ZIP="$HOME/cocos-installer/creator.zip"
          if [ ! -f "$ZIP" ]; then
            curl --fail --location --retry 2 --connect-timeout 30 --max-time 480 --speed-time 45 --speed-limit 2048 --output "$ZIP" https://download.cocos.com/CocosCreator/v3.8.7/CocosCreator-v3.8.7-mac-080718.zip
          fi
          ditto -xk "$ZIP" "$RUNNER_TEMP/cocos"
          APP=$(find "$RUNNER_TEMP/cocos" -maxdepth 4 -name CocosCreator.app -type d -print -quit)
          test -n "$APP"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_APP=$APP" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl list runtimes
      - uses: actions/cache/save@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true' && steps.creator-cache.outputs.cache-hit != 'true'
        with:
          path: ~/cocos-installer
          key: cocos-creator-3.8.7-mac-080718
      - name: Export isolated iOS Simulator project
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: |
          node tools/ios-ci/prepare-simulator.cjs
          mkdir -p build/ios-logs
          set +e
          "$CREATOR_APP/Contents/MacOS/CocosCreator" --project "$GITHUB_WORKSPACE" --build "configPath=$GITHUB_WORKSPACE/config/buildConfig_ios.json" > build/ios-logs/creator.log 2>&1
          result=$?
          set -e
          tail -80 build/ios-logs/creator.log
          test "$result" -eq 36
          node tools/ios-cloud-build.cjs signing
          node tools/ios-cloud-build.cjs prepare
      - name: Build x86_64 Simulator app
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        run: |
          project=$(find build/ios/proj -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          set +e
          xcodebuild -project "$project" -scheme DicePet-mobile -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/pm-simulator-build" -jobs 3 \
            PRODUCT_BUNDLE_IDENTIFIER=com.dice.pet.rpg CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO TARGETED_DEVICE_FAMILY=1 \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 build > build/ios-logs/simulator-xcode.log 2>&1
          result=$?
          set -e
          tail -80 build/ios-logs/simulator-xcode.log
          test "$result" -eq 0
      - uses: actions/cache/save@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          path: build/ios/proj/Release-iphonesimulator/DicePet-mobile.app
          key: ${{ steps.simulator-cache.outputs.cache-primary-key }}
      - name: Test compact, Dynamic Island and large iPhones
        timeout-minutes: 18
        run: |
          app="$GITHUB_WORKSPACE/build/ios/proj/Release-iphonesimulator/DicePet-mobile.app"
          test -d "$app"
          python3 -u tools/ios-ci/run-simulator.py "$app" build/ios-simulator-evidence "${{ matrix.profile }}"
      - name: Save Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dicekin-iOS-Simulator-${{ matrix.profile }}-${{ github.run_number }}
          path: |
            build/ios-simulator-evidence/
            build/ios-logs/
          if-no-files-found: error
          retention-days: 14
