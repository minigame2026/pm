name: iOS App Store upload
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-cloud-build]
    paths:
      - .github/workflows/ios-appstore-upload.yml
      - tools/ios-appstore-upload.cjs
      - config/ios-appstore-upload.json
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-appstore-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read verified build source
        id: source
        run: node tools/ios-appstore-upload.cjs source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: build/ios-upload-source
      - name: Verify IPA and upload when credentials are available
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: node tools/ios-appstore-upload.cjs upload
      - name: Save IPA and delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dice-Pet-Spirits-AppStore-1.0-build3
          path: build/ios-delivery/
          if-no-files-found: warn
          retention-days: 30
