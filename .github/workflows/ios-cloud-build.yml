name: iOS cloud build
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-cloud-build]

permissions:
  contents: read
concurrency:
  group: ios-cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production source and Xcode
        run: |
          node tools/ios-cloud-build.cjs preflight
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Cache Creator installer
        uses: actions/cache@v4
        with:
          path: ~/cocos-installer
          key: cocos-creator-3.8.7-mac-080718
      - name: Install Creator 3.8.7
        shell: bash
        run: |
          mkdir -p "$HOME/cocos-installer" "$RUNNER_TEMP/cocos"
          ZIP="$HOME/cocos-installer/creator.zip"
          if [ ! -f "$ZIP" ]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 --output "$ZIP" https://download.cocos.com/CocosCreator/v3.8.7/CocosCreator-v3.8.7-mac-080718.zip
          fi
          ditto -xk "$ZIP" "$RUNNER_TEMP/cocos"
          APP=$(find "$RUNNER_TEMP/cocos" -maxdepth 4 -name CocosCreator.app -type d -print -quit)
          test -n "$APP"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "CREATOR_APP=$APP" >> "$GITHUB_ENV"
      - name: Export iOS project
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p build/ios-logs
          set +e
          "$CREATOR_APP/Contents/MacOS/CocosCreator" --project "$GITHUB_WORKSPACE" --build "configPath=$GITHUB_WORKSPACE/config/buildConfig_ios.json" > build/ios-logs/creator.log 2>&1
          RESULT=$?
          set -e
          tail -n 80 build/ios-logs/creator.log
          test "$RESULT" -eq 36
      - name: Import distribution identity when supplied
        shell: bash
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APP_STORE_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
        run: node tools/ios-cloud-build.cjs signing
      - name: Prepare native app
        run: node tools/ios-cloud-build.cjs prepare
      - name: Archive and export
        run: node tools/ios-cloud-build.cjs archive
      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dice-Pet-Spirits-iOS-${{ github.run_number }}
          path: |
            build/ios-export/
            build/ios-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pm-signing/keychain.path" ]; then
            security delete-keychain "$(cat "$RUNNER_TEMP/pm-signing/keychain.path")" || true
          fi
          if [ -f "$RUNNER_TEMP/pm-signing/profile.path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/pm-signing/profile.path")"
          fi
          rm -rf "$RUNNER_TEMP/pm-signing"
